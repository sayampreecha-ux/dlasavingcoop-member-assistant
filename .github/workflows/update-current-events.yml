name: Update current member events

on:
  push:
    branches: [main]
    paths:
      - 'scripts/update-current-events.mjs'
      - 'tests/current-events.mjs'
      - '.github/workflows/update-current-events.yml'
  schedule:
    - cron: '10 0,6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: current-member-events
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Refresh official current events
        env:
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          FACEBOOK_PAGE_REF: ${{ vars.FACEBOOK_PAGE_REF }}
          FACEBOOK_GRAPH_VERSION: ${{ vars.FACEBOOK_GRAPH_VERSION }}
        run: node scripts/update-current-events.mjs

      - name: Validate current events
        run: |
          node tests/current-events.mjs
          node tests/regression.mjs

      - name: Commit current events to main
        id: commit_main
        shell: bash
        run: |
          if git diff --quiet -- data/current-events.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/current-events.json
          git commit -m "Auto-update current member events"
          git push origin main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Sync current events to production
        if: steps.commit_main.outputs.changed == 'true'
        shell: bash
        run: |
          cp data/current-events.json /tmp/current-events.json
          git fetch origin gh-pages
          git checkout gh-pages
          mkdir -p data
          cp /tmp/current-events.json data/current-events.json
          git add data/current-events.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Publish current member events"
          git push origin gh-pages
