name: E2E Member Answer Engine
on:
  pull_request:
    branches: [main]
    paths: ["index.html", "data/**", "tests/**", "scripts/**", ".github/workflows/e2e.yml"]
  push:
    branches: [fix/pilot-69-executable-hardening, fix/news-freshness-separation-20261021]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser test runtime
        timeout-minutes: 5
        run: |
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          npm install --no-save --no-package-lock playwright@1.62.1 && npx playwright install --with-deps chromium
      - name: Run every release regression suite
        run: node scripts/verify-release.mjs
      - name: Loan scenario acceptance on mobile and desktop
        run: node scripts/browser-loan-scenarios-smoke.mjs
      - name: Independent leisure browser diagnostic - mobile 390px
        env:
          LEISURE_VIEWPORT_WIDTH: '390'
          LEISURE_SCREENSHOT_DIR: browser-diagnostics
        run: node scripts/browser-leisure-loan-smoke.mjs
      - name: Independent leisure browser diagnostic - desktop 1365px
        if: success() || failure()
        env:
          LEISURE_VIEWPORT_WIDTH: '1365'
          LEISURE_SCREENSHOT_DIR: browser-diagnostics
        run: node scripts/browser-leisure-loan-smoke.mjs
      - name: Upload independent browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: leisure-independent-browser-diagnostics
          path: browser-diagnostics/
          if-no-files-found: warn
      - name: Verify live official news ingestion
        if: success() || failure()
        run: node scripts/verify-live-news-ingestion.mjs
      - name: Latest news browser mobile and desktop
        if: success() || failure()
        run: node scripts/browser-latest-news-acceptance.mjs
      - name: Upload latest news acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr154-news-final-acceptance
          path: news-browser-evidence/
          if-no-files-found: error
      - name: Real browser Pilot regression on mobile and desktop
        if: success() || failure()
        run: node scripts/browser-all-acceptance.mjs
      - name: PR136 scoped member answer acceptance
        if: success() || failure()
        run: node scripts/browser-pr136-release-acceptance.mjs
      - name: Upload PR136 member answer evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr136-member-answer-acceptance
          path: pr136-browser-evidence/
          if-no-files-found: error

      - name: Share-backed loan primary rules UI acceptance
        if: success() || failure()
        run: node scripts/browser-share-backed-loan-smoke.mjs
      - name: Upload share-backed loan browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: share-backed-loan-browser-evidence
          path: share-loan-browser-evidence/
          if-no-files-found: error

      - name: Debt-specific loan UI acceptance
        if: success() || failure()
        run: node scripts/browser-debt-specific-loans-smoke.mjs
      - name: Upload debt-specific loan browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debt-specific-loan-browser-evidence
          path: debt-loan-browser-evidence/
          if-no-files-found: error

      - name: Upload loan scenario browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: loan-scenario-browser-evidence
          path: loan-scenario-browser-evidence/
          if-no-files-found: warn
