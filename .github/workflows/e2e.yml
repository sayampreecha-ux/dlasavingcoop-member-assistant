name: E2E Member Answer Engine
on:
  pull_request:
    branches: [main]
    paths: ["index.html", "tests/**", ".github/workflows/e2e.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run deterministic E2E regression
        run: node tests/e2e-member-answer-engine.mjs && node tests/real-member-simulation.mjs
