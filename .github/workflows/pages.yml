name: Deploy GitHub Pages
# Re-run full release and production verification without changing test criteria.
on:
  push:
    branches: [main]
    paths: ["index.html", "data/**", "tests/**", "scripts/browser-*.mjs", "scripts/verify-release.mjs", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Release gate before deployment
        run: node scripts/verify-release.mjs
      - name: Install browser test runtime
        timeout-minutes: 5
        run: |
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          npm install --no-save --no-package-lock playwright@1.62.1 && npx playwright install --with-deps chromium
      - name: Browser release gate
        run: |
          MEMBER_MONITOR_FIXTURE=data/official-source-registry.json node scripts/browser-pilot-smoke.mjs
          MEMBER_MONITOR_FIXTURE=data/official-source-registry.json node scripts/browser-freshness-smoke.mjs
          node scripts/browser-live-journey-smoke.mjs
          node scripts/browser-answer-first-smoke.mjs
          node scripts/browser-education-disaster-smoke.mjs
          node scripts/browser-realistic-member-smoke.mjs
          node scripts/browser-evidence-quality-smoke.mjs
          node scripts/browser-member-language-smoke.mjs
          node scripts/browser-special-deposit-smoke.mjs
      - name: Stage public Pilot files
        run: |
          mkdir -p _site/data
          cp index.html .nojekyll _site/
          cp -r assets _site/
          cp data/current-events.json data/official-rule-master.json data/official-source-registry.json data/official-source-monitor.json _site/data/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify live Production on mobile and desktop
        env:
          MEMBER_APP_URL: https://sayampreecha-ux.github.io/dlasavingcoop-member-assistant/
        run: |
          MEMBER_MONITOR_FIXTURE=data/official-source-registry.json node scripts/browser-pilot-smoke.mjs
          MEMBER_MONITOR_FIXTURE=data/official-source-registry.json node scripts/browser-freshness-smoke.mjs
          node scripts/browser-live-journey-smoke.mjs
          node scripts/browser-answer-first-smoke.mjs
          node scripts/browser-education-disaster-smoke.mjs
          node scripts/browser-realistic-member-smoke.mjs
          node scripts/browser-evidence-quality-smoke.mjs
          node scripts/browser-member-language-smoke.mjs
          node scripts/browser-special-deposit-smoke.mjs
